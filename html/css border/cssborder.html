<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        p.dotted {border-style: dotted;}
        p.dashed {border-style: dashed;}
        p.solid {border-style: solid;}
        p.double {border-style: double;}
        p.groove {border-style: groove;}
        p.ridge {border-style: ridge;}
        p.inset {border-style: inset;}
        p.outset {border-style: outset;}
        p.none {border-style: none;}
        p.hidden {border-style: hidden;}
        p.mix {border-style: dotted dashed solid double;}
        p.one {border-style: solid; border-width: 5px;}
        p.two {border-style: solid; border-width: medium;}
        p.three {border-style: dotted;  border-width: 2px;}
    </style>
</head>
<body>
    <p class="dotted">this is dotted</p>
    <p class="dashed">this is dashed</p>
    <p class="solid">this is solid</p>
    <p class="double">this is double</p>
    <p class="groove">this is groove</p>
    <p class="ridge">this is ridge</p>
    <p class="inset">this is inset</p>
    <p class="outset">this is outset</p>
    <p class="none">this is none</p>
    <p class="hidden">this is hidden</p>
    <p class="mix">this is mix</p>
    <p class="one">this is one</p>
    <p class="two">this is two</p>
    <p class="three">this is theee</p>
    
    <p style="border-style: dashed; border-color: blueviolet;"> kkk </p>
</body>
</html>
