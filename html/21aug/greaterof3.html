<!DOCTYPE html>
<body>
    <input type="number" id="num1"  placeholder="enter no.">
    <input type="number" id="num2"  placeholder="enter no.">
    <input type="number" id="num3"  placeholder="enter no.">
    <button onclick="greater()">greater</button>
    <h2 id="result"></h2>
    <script>
        function greater(){
            let a=Number(document.getElementById("num1").value);
            let b=Number(document.getElementById("num2").value);
            let c=Number(document.getElementById("num3").value);
            let s;
            if(a>b){
                if(a>c)
                    s=a;
                else
                    s=c;
            }
            else{
                if(b>c)
                    s=b;
                else
                    s=c;
            }
            document.getElementById("result").innerText="Greater="+s;
        }
    </script>
</body>
