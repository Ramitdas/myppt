<!DOCTYPE html>
<body>
    <input type="number" id="num1"  placeholder="enter no.">
    <button onclick="check()">even or odd</button>
    <h2 id="result"></h2>
    <script>
        function check(){
            let a=Number(document.getElementById("num1").value);
            if(a%2==0)
                document.getElementById("result").innerText="even";
            else
                document.getElementById("result").innerText="odd";
        }
    </script>
</body>
